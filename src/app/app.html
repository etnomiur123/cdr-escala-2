<main class="app-shell">
  <header class="topbar">
    <div class="brand">
      <p class="eyebrow">Escala de Musicos</p>
      <h1>Canto do Rio Planner</h1>
    </div>

    <div class="auth-box">
      @if (auth.isLoggedIn()) {
        <p>
          Sessao: <strong>{{ auth.user()?.displayName || auth.user()?.email }}</strong>
        </p>

        <label>
          Naipe
          <select
            [ngModel]="profile()?.naipe || ''"
            (ngModelChange)="setNaipe($event)"
          >
            <option value="">Selecionar</option>
            <option value="Vocalista">Voz</option>
            <option value="Guitarra">Guitarra Portuguesa</option>
            <option value="Viola">Viola</option>
          </select>
        </label>

        <button type="button" class="ghost" (click)="auth.logout()">Sair</button>
      } @else {
        <p>Entra com Google para gerir escalas e responder disponibilidades.</p>
        <button type="button" (click)="auth.loginWithGoogle()">Entrar com Google</button>
      }
    </div>
  </header>

  <router-outlet></router-outlet>
</main>
